name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*
          draft: false
          prerelease: false

  # 生成 updater 元数据(latest.json),供应用内检查更新使用
  generate-updater-json:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Generate latest.json for updater
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          python3 - <<'PY'
          import json, glob, os, hashlib, base64

          version = os.environ.get("VERSION")
          repo = os.environ.get("REPO")
          tag = os.environ.get("TAG")

          platforms = {}

          # Windows NSIS (.exe) + .sig
          nsis_exe = None
          nsis_sig = None
          for p in glob.glob("bundles/**/*setup*.exe", recursive=True) + glob.glob("bundles/**/*.exe", recursive=True):
              if "setup" in p.lower() or "installer" in p.lower():
                  nsis_exe = p
          for p in glob.glob("bundles/**/*.sig", recursive=True):
              nsis_sig = p

          if nsis_exe and nsis_sig:
              url = f"https://github.com/{repo}/releases/download/{tag}/{os.path.basename(nsis_exe)}"
              with open(nsis_sig) as f:
                  sig = f.read().strip()
              platforms["windows-x86_64"] = {"signature": sig, "url": url}

          # macOS (.dmg) + .sig
          dmg = None
          dmg_sig = None
          for p in glob.glob("bundles/**/*.dmg", recursive=True):
              dmg = p
          for p in glob.glob("bundles/**/*.dmg.sig", recursive=True):
              dmg_sig = p
          if dmg and dmg_sig:
              url = f"https://github.com/{repo}/releases/download/{tag}/{os.path.basename(dmg)}"
              with open(dmg_sig) as f:
                  sig = f.read().strip()
              platforms["darwin-aarch64"] = {"signature": sig, "url": url}

          # Linux AppImage/deb + .sig
          for ext in ["*.AppImage", "*.deb", "*.rpm"]:
              for p in glob.glob(f"bundles/**/{ext}", recursive=True):
                  sig_path = p + ".sig"
                  if os.path.exists(sig_path):
                      url = f"https://github.com/{repo}/releases/download/{tag}/{os.path.basename(p)}"
                      with open(sig_path) as f:
                          sig = f.read().strip()
                      arch = "linux-x86_64"
                      if ".deb" in p: arch = "linux-x86_64"
                      platforms[arch] = {"signature": sig, "url": url}

          import datetime
          manifest = {
              "version": version,
              "notes": f"Release {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload latest.json to Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          draft: false
          prerelease: false
